services:
  api:
    build: .
    env_file: .env
    ports:
      - "8090:${SERVER_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      mailhog:
        condition: service_started

  migrate:
    build: .
    command: ["migrate"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    ports:
      - "4568:4566"
    volumes:
      - ./local/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/os-service-ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8026:8025"
