apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workshop

resources:
  - ../../base

configMapGenerator:
  - name: os-config
    envs:
      - config.env
  - name: os-deploy-params
    envs:
      - deploy-params.env
    options:
      disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: os-deploy-params
      fieldPath: data.IRSA_ROLE_ARN
    targets:
      - select:
          kind: ServiceAccount
          name: os-service
        fieldPaths:
          - metadata.annotations.[eks.amazonaws.com/role-arn]
  - source:
      kind: ConfigMap
      name: os-deploy-params
      fieldPath: data.TARGET_GROUP_ARN
    targets:
      - select:
          kind: TargetGroupBinding
          name: os-service
        fieldPaths:
          - spec.targetGroupARN
