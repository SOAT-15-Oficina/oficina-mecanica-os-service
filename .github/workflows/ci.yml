name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, hml]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main, hml]
    paths-ignore: ["**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  GO_VERSION: "1.26"
  TF_VERSION: "1.9.8"
  SERVICE: os-service

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo rhysd/actionlint:latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@1.34.5 lint workshop --config redocly.yaml

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate Terraform
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for overlay in k8s/overlays/*/; do
            kubectl kustomize "$overlay" | ./kubeconform -strict -summary -ignore-missing-schemas -
          done

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: techchallenge
          POSTGRES_PASSWORD: os-ci
          POSTGRES_DB: techchallenge-db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techchallenge -d techchallenge-db"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test with coverage
        run: go test ./... -race -p 1 -coverpkg=./... -coverprofile=coverage.out -covermode=atomic
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: techchallenge
          DATABASE_PASSWORD: os-ci
          DATABASE_NAME: techchallenge-db

      - name: Enforce coverage
        run: ./scripts/coverage-gate.sh coverage.out

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 1

  quality:
    if: github.event_name == 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:lts-community
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Wait for SonarQube
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube nao subiu a tempo"
          exit 1

      - name: Provision token and quality gate
        run: |
          NEW_PASS="$(openssl rand -hex 20)"
          curl -sf -u admin:admin -X POST "http://localhost:9000/api/users/change_password" \
            -d "login=admin&previousPassword=admin&password=${NEW_PASS}" >/dev/null
          TOKEN="$(curl -sf -u "admin:${NEW_PASS}" -X POST "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-${GITHUB_RUN_ID}" | jq -r .token)"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          api() { curl -sf -u "${TOKEN}:" -X POST "http://localhost:9000/api/qualitygates/$1" -d "$2" >/dev/null; }
          api create "name=oficina-fase4"
          api create_condition "gateName=oficina-fase4&metric=coverage&op=LT&error=80"
          api create_condition "gateName=oficina-fase4&metric=bugs&op=GT&error=0"
          api create_condition "gateName=oficina-fase4&metric=vulnerabilities&op=GT&error=0"
          api create_condition "gateName=oficina-fase4&metric=duplicated_lines_density&op=GT&error=3"
          api set_as_default "name=oficina-fase4"

      - name: Scan and wait for Quality Gate
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -e SONAR_HOST_URL=http://localhost:9000 \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "${GITHUB_WORKSPACE}:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Publish metrics
        if: always()
        run: |
          KEY="$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)"
          api() { curl -sf -u "${SONAR_TOKEN}:" "http://localhost:9000/$1"; }

          GATE="$(api "api/qualitygates/project_status?projectKey=${KEY}")"
          STATUS="$(jq -r '.projectStatus.status' <<<"$GATE")"
          echo "QUALITY_GATE_STATUS=$STATUS" >> "$GITHUB_ENV"

          KEYS=coverage,duplicated_lines_density,bugs,vulnerabilities,security_hotspots,code_smells,ncloc
          MEASURES="$(api "api/measures/component?component=${KEY}&metricKeys=${KEYS}")"

          {
            echo "## SonarQube -- Quality Gate: ${STATUS}"
            echo
            echo "| Condicao | Valor | Limite | Status |"
            echo "|---|---|---|---|"
            jq -r '.projectStatus.conditions[] | "| \(.metricKey) | \(.actualValue // "-") | \(.comparator) \(.errorThreshold) | \(.status) |"' <<<"$GATE"
            echo
            echo "| Metrica | Valor |"
            echo "|---|---|"
            jq -r '.component.measures[] | "| \(.metric) | \(.value) |"' <<<"$MEASURES" | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce quality gate
        if: always()
        run: |
          echo "Quality Gate: ${QUALITY_GATE_STATUS:-INDISPONIVEL}"
          test "${QUALITY_GATE_STATUS:-}" = OK

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'hml' && 'homolog' || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        run: |
          case "$GITHUB_REF_NAME" in
            main) ENVIRONMENT=prod ;;
            hml)  ENVIRONMENT=homolog ;;
            *)
              echo "branch $GITHUB_REF_NAME nao mapeia para nenhum ambiente"
              exit 1
              ;;
          esac
          {
            echo "ENVIRONMENT=$ENVIRONMENT"
            echo "SSM_PREFIX=/oficina-mecanica/$ENVIRONMENT"
            echo "OVERLAY=k8s/overlays/$ENVIRONMENT"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Apply service infrastructure
        run: |
          terraform -chdir=infra init -input=false -backend-config="${ENVIRONMENT}.s3.tfbackend"
          terraform -chdir=infra apply -input=false -auto-approve -var-file="${ENVIRONMENT}.tfvars"

      - name: Resolve outputs
        env:
          SES_SENDER_EMAIL: ${{ vars.SES_SENDER_EMAIL }}
        run: |
          get() { aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text; }
          {
            echo "EKS_CLUSTER_NAME=$(get eks_cluster_name)"
            echo "KUBE_NAMESPACE=$(get kube_namespace)"
            echo "PUBLIC_BASE_URL=$(get public_base_url)"
            echo "ECR_REPOSITORY_URL=$(get os_ecr_repository)"
            echo "SECRET_ARN=$(get os_secret_arn)"
            echo "JWT_SECRET_ARN=$(get jwt_secret_arn)"
            echo "INTERNAL_TOKEN_SECRET_ARN=$(get internal_service_token_secret_arn)"
          } >> "$GITHUB_ENV"
          {
            echo "APP_BASE_URL=$(get public_base_url)"
            echo "AWS_DEFAULT_REGION=${AWS_REGION}"
            echo "DATABASE_HOST=$(get os_database_endpoint)"
            echo "DATABASE_PORT=5432"
            echo "DATABASE_NAME=$(get os_database_name)"
            echo "DATABASE_USER=$(get os_database_user)"
            echo "MESSAGING_INBOX_QUEUE_URL=$(get os_inbox_queue_url)"
            echo "BILLING_INBOX_QUEUE_URL=$(get billing_inbox_queue_url)"
            echo "EXECUTION_INBOX_QUEUE_URL=$(get execution_inbox_queue_url)"
            echo "SES_SENDER_EMAIL=${SES_SENDER_EMAIL}"
          } >> "${OVERLAY}/config.env"
          {
            echo "IRSA_ROLE_ARN=$(get os_role_arn)"
            echo "TARGET_GROUP_ARN=$(get os_target_group_arn)"
          } > "${OVERLAY}/deploy-params.env"

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE="${ECR_REPOSITORY_URL}:${GITHUB_SHA}"
          docker build --build-arg "VERSION=${GITHUB_SHA}" --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          cat >> "${OVERLAY}/kustomization.yaml" <<YAML

          images:
            - name: ${SERVICE}
              newName: ${ECR_REPOSITORY_URL}
              newTag: ${GITHUB_SHA}
          YAML

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME"

      - name: Sync secrets
        run: |
          secret() { aws secretsmanager get-secret-value --secret-id "$1" --query SecretString --output text; }
          JWT_SECRET_KEY="$(secret "$JWT_SECRET_ARN")"
          INTERNAL_SERVICE_TOKEN="$(secret "$INTERNAL_TOKEN_SECRET_ARN")"
          echo "::add-mask::$JWT_SECRET_KEY"
          echo "::add-mask::$INTERNAL_SERVICE_TOKEN"
          {
            secret "$SECRET_ARN" | jq -r 'to_entries[] | select(.key != "JWT_SECRET_KEY" and .key != "INTERNAL_SERVICE_TOKEN") | "\(.key)=\(.value)"'
            echo "JWT_SECRET_KEY=$JWT_SECRET_KEY"
            echo "INTERNAL_SERVICE_TOKEN=$INTERNAL_SERVICE_TOKEN"
          } > /tmp/secrets.env
          kubectl -n "$KUBE_NAMESPACE" create secret generic "${SERVICE%-service}-secrets" \
            --from-env-file=/tmp/secrets.env --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/secrets.env

      - name: Apply manifests
        run: kubectl kustomize "$OVERLAY" | kubectl -n "$KUBE_NAMESPACE" apply -f -

      - name: Run migrations
        run: |
          JOB="${SERVICE}-migrate-${GITHUB_SHA::12}"
          CONFIG="$(kubectl -n "$KUBE_NAMESPACE" get deployment "$SERVICE" \
            -o jsonpath='{.spec.template.spec.containers[0].envFrom[0].configMapRef.name}')"
          kubectl -n "$KUBE_NAMESPACE" delete job "$JOB" --ignore-not-found
          kubectl -n "$KUBE_NAMESPACE" apply -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${IMAGE}
                    args: ["migrate"]
                    envFrom:
                      - configMapRef:
                          name: ${CONFIG}
                      - secretRef:
                          name: ${SERVICE%-service}-secrets
          YAML
          kubectl -n "$KUBE_NAMESPACE" wait --for=condition=complete "job/$JOB" --timeout=300s \
            || { kubectl -n "$KUBE_NAMESPACE" logs "job/$JOB" --tail=200; exit 1; }

      - name: Wait for rollout
        run: kubectl -n "$KUBE_NAMESPACE" rollout status "deployment/${SERVICE}" --timeout=300s

      - name: Smoke check
        run: |
          kubectl -n "$KUBE_NAMESPACE" port-forward "deployment/${SERVICE}" 18080:8080 &
          trap 'kill %1 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/ready >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18080/ping | grep -Fx Pong
          curl -sf "http://127.0.0.1:18080/docs/swagger.yaml" | cmp - docs/swagger.yaml
