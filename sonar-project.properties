sonar.projectKey=oficina-mecanica-os-service
sonar.projectName=Oficina Mecanica - OS Service
sonar.projectVersion=4.0.0

sonar.sourceEncoding=UTF-8
sonar.sources=cmd,database,docs,internal,packages
sonar.tests=internal,packages
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,.git/**,.scannerwork/**,.vscode/**,.github/**,infra/**,k8s/**,local/**,tests/**
sonar.coverage.exclusions=cmd/**,database/**,docs/**,tests/**,**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
